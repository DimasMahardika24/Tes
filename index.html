<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Super Mario 2P Realtime</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
    body { background: #0d1117; font-family: 'Segoe UI', Tahoma, sans-serif; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
    .card { width: 100%; max-width: 500px; background: #161b22; border: 1px solid #30363d; border-radius: 16px; padding: 14px; position: relative; overflow: hidden; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .title { font-size: 18px; font-weight: 800; color: #58a6ff; }
    .menu-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #161b22; z-index: 10; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; gap: 14px; }
    .menu-title { font-size: 22px; font-weight: 800; color: #58a6ff; margin-bottom: 10px; text-align: center; }
    .btn-menu { width: 80%; max-width: 250px; padding: 12px; border: none; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; text-align: center; }
    .btn-host { background: #238636; color: #fff; }
    .btn-join-mode { background: #1f6feb; color: #fff; }
    .join-box { display: none; width: 80%; max-width: 250px; flex-direction: column; gap: 8px; }
    .join-box input { width: 100%; background: #0d1117; border: 1px solid #30363d; color: #fff; padding: 10px; border-radius: 6px; font-size: 13px; text-align: center; outline: none; }
    .status { font-size: 12px; color: #e3b341; margin-bottom: 10px; font-weight: 600; text-align: center; background: #0d1117; padding: 6px; border-radius: 8px; border: 1px solid #21262d; }
    .game-wrapper { width: 100%; aspect-ratio: 16/9; background: #5c94fc; border-radius: 12px; overflow: hidden; border: 2px solid #30363d; position: relative; }
    canvas { width: 100%; height: 100%; display: block; }
    .touch-controls { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
    .dpad, .actions { display: flex; gap: 10px; }
    .btn-game { width: 52px; height: 52px; background: #21262d; border: 1px solid #30363d; color: #c9d1d9; border-radius: 12px; font-size: 20px; font-weight: bold; display: flex; align-items: center; justify-content: center; touch-action: manipulation; box-shadow: 0 4px 0 #0d1117; }
    .btn-game:active { transform: translateY(3px); box-shadow: 0 1px 0 #0d1117; background: #2ea043; color: #fff; }
    .btn-jump { width: 80px; background: #da3633; color: #fff; box-shadow: 0 4px 0 #8e1513; }
    .btn-jump:active { background: #b62321; box-shadow: 0 1px 0 #8e1513; }
    .coin-counter { position: absolute; top: 8px; right: 8px; background: rgba(13,17,23,0.75); color: #ffd33d; font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 20px; z-index: 5; }
    .win-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(13,17,23,0.9); z-index: 20; flex-direction: column; justify-content: center; align-items: center; gap: 14px; }
    .win-text { font-size: 26px; font-weight: 900; text-align: center; color: #ffd33d; padding: 0 16px; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div class="card">
  <div class="menu-overlay" id="menuOverlay">
    <div class="menu-title">🍄 MARIO 2P REALTIME</div>
    <button class="btn-menu btn-host" id="btnChooseHost">🎮 BUAT ROOM (HOST)</button>
    <button class="btn-menu btn-join-mode" id="btnChooseJoin">🔗 GABUNG ROOM (JOIN)</button>
    
    <div class="join-box" id="joinBox">
      <input type="text" id="roomIdInput" placeholder="Masukkan ID Room (6 Digit)...">
      <button class="btn-menu btn-join-mode" style="width:100%" id="btnConnect">MASUK GAME</button>
    </div>
  </div>

  <div class="header">
    <div class="title">🍄 Mario 2P Online</div>
    <div id="roleTag" style="font-size:12px; color:#58a6ff; font-weight:bold;">Waiting...</div>
  </div>

  <div class="status" id="status">Pilih Mode Bermain...</div>

  <div class="game-wrapper">
    <canvas id="canvas"></canvas>
    <div class="coin-counter" id="coinCounter">🪙 0/5</div>
    <div class="win-overlay" id="winOverlay">
      <div class="win-text" id="winText">🏆</div>
      <button class="btn-menu btn-host" id="btnRestart">MAIN LAGI</button>
    </div>
  </div>

  <div class="touch-controls">
    <div class="dpad">
      <div class="btn-game" id="btnLeft">◀</div>
      <div class="btn-game" id="btnRight">▶</div>
    </div>
    <div class="actions">
      <div class="btn-game btn-jump" id="btnJump">LOMPAT</div>
    </div>
  </div>
</div>

<script>
(function(){
  const firebaseConfig = {
    databaseURL: "https://tester-b643b-default-rtdb.firebaseio.com/"
  };
  if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const dbRoot = firebase.database();

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = 440; canvas.height = 247;

  let myRole = 'p1';
  let roomRef = null;
  let myChar, opponentChar;
  let platforms, coinsList, enemies, movingPlatform;
  let coinsTaken = 0;
  let gameOver = false;
  const gravity = 0.45;

  const menuOverlay = document.getElementById('menuOverlay');
  const btnChooseHost = document.getElementById('btnChooseHost');
  const btnChooseJoin = document.getElementById('btnChooseJoin');
  const joinBox = document.getElementById('joinBox');
  const roleTag = document.getElementById('roleTag');

  btnChooseJoin.onclick = () => {
    btnChooseHost.style.display = 'none';
    btnChooseJoin.style.display = 'none';
    joinBox.style.display = 'flex';
  };

  btnChooseHost.onclick = () => {
    myRole = 'p1';
    roleTag.textContent = 'HOST (Mario)';
    const roomId = Math.floor(100000 + Math.random() * 900000).toString();
    roomRef = dbRoot.ref('rooms/' + roomId);

    roomRef.set({
      created: Date.now(),
      status: 'waiting'
    });

    document.getElementById('status').textContent = 'Kode Room: ' + roomId + ' (Tunggu P2 Masuk)';
    menuOverlay.style.display = 'none';
    initGame(roomId);
  };

  document.getElementById('btnConnect').onclick = () => {
    const targetId = document.getElementById('roomIdInput').value.trim();
    if(!targetId) return alert('Masukkan ID Room!');

    const btnConnect = document.getElementById('btnConnect');
    btnConnect.disabled = true;
    btnConnect.textContent = 'MENGECEK ROOM...';

    dbRoot.ref('rooms/' + targetId).get().then(snap => {
      btnConnect.disabled = false;
      btnConnect.textContent = 'MASUK GAME';
      if(!snap.exists()){
        alert('Room ID tidak ditemukan! Cek lagi kodenya.');
        return;
      }

      myRole = 'p2';
      roleTag.textContent = 'JOINER (Luigi)';
      roomRef = dbRoot.ref('rooms/' + targetId);

      document.getElementById('status').textContent = 'Terhubung! Memuat Game...';
      menuOverlay.style.display = 'none';
      initGame(targetId);
    }).catch(() => {
      btnConnect.disabled = false;
      btnConnect.textContent = 'MASUK GAME';
      alert('Gagal cek room, coba lagi.');
    });
  };

  function initGame(roomId){
    const spawnX = myRole === 'p1' ? 30 : 60;
    myChar = { 
      x: spawnX, y: 140, w: 18, h: 24, vx: 0, vy: 0, 
      grounded: false, facing: 'right', spawnX: spawnX, spawnY: 140 
    };
    
    opponentChar = { 
      x: myRole === 'p1' ? 60 : 30, y: 140, targetX: 60, targetY: 140, 
      w: 18, h: 24, vx: 0, facing: 'right' 
    };

    platforms = [
      { x: 0, y: 210, w: 320, h: 40 },
      { x: 380, y: 210, w: 500, h: 40 },
      { x: 90, y: 160, w: 60, h: 14 },
      { x: 200, y: 130, w: 80, h: 14 },
      { x: 420, y: 160, w: 70, h: 14 },
      { x: 530, y: 120, w: 80, h: 14 }
    ];

    movingPlatform = { x: 315, y: 170, w: 55, h: 12, vx: 1, minX: 310, maxX: 375 };

    coinsList = [
      { x: 110, y: 135, taken: false },
      { x: 220, y: 105, taken: false },
      { x: 245, y: 105, taken: false },
      { x: 445, y: 135, taken: false },
      { x: 560, y: 95, taken: false }
    ];

    enemies = [
      { x: 210, y: 194, w: 16, h: 16, vx: -0.8, minX: 180, maxX: 300, alive: true },
      { x: 450, y: 194, w: 16, h: 16, vx: 0.8, minX: 400, maxX: 550, alive: true }
    ];

    coinsTaken = 0;
    gameOver = false;
    document.getElementById('coinCounter').textContent = '🪙 0/' + coinsList.length;
    document.getElementById('winOverlay').style.display = 'none';

    window.keys = { left: false, right: false };

    // Sync koin: siapapun yang ambil, tulis ke Firebase, kedua sisi dengerin bareng
    roomRef.child('coins').on('value', (snap) => {
      const d = snap.val();
      if(!d) return;
      let takenCount = 0;
      coinsList.forEach((c, i) => {
        if(d[i]) { c.taken = true; takenCount++; }
      });
      coinsTaken = takenCount;
      document.getElementById('coinCounter').textContent = '🪙 ' + coinsTaken + '/' + coinsList.length;
    });

    // Sync pemenang: siapapun sampai duluan, semua langsung lihat hasilnya
    roomRef.child('winner').on('value', (snap) => {
      const w = snap.val();
      if(w && !gameOver){
        gameOver = true;
        const won = w === myRole;
        document.getElementById('winText').textContent = won ? '🏆 KAMU MENANG!' : '😢 LAWAN MENANG!';
        document.getElementById('winOverlay').style.display = 'flex';
      }
    });

    // Presence: tandai diri sendiri online, otomatis kehapus kalau tab ditutup/koneksi putus
    const presenceRef = roomRef.child('presence/' + myRole);
    presenceRef.onDisconnect().remove();
    presenceRef.set(true);
    if(myRole === 'p1'){
      roomRef.onDisconnect().remove(); // host keluar -> room ikut dibersihkan
    }

    // Listen status koneksi lawan (nyambung / putus)
    const oppKey = myRole === 'p1' ? 'p2' : 'p1';
    let opponentOnline = false;
    roomRef.child('presence/' + oppKey).on('value', (snap) => {
      opponentOnline = !!snap.val();
      if(opponentOnline){
        document.getElementById('status').textContent = '🟢 Lawan terhubung! Main jalan...';
      } else {
        document.getElementById('status').textContent = myRole === 'p1'
          ? '🟡 Room: ' + roomId + ' (Menunggu lawan...)'
          : '🔴 Lawan terputus / belum masuk.';
      }
    });

    // Listen data posisi lawan secara realtime dari Firebase
    roomRef.child(oppKey).on('value', (snap) => {
      const data = snap.val();
      if(data){
        opponentChar.targetX = data.x;
        opponentChar.targetY = data.y;
        opponentChar.facing = data.facing;
      }
    });

    // Sync status platform berjalan & musuh (Host mengontrol logika map)
    if(myRole === 'p1'){
      setInterval(() => {
        roomRef.child('mapState').set({
          platX: Math.round(movingPlatform.x),
          e1X: Math.round(enemies[0].x), e1Alive: enemies[0].alive,
          e2X: Math.round(enemies[1].x), e2Alive: enemies[1].alive
        });
      }, 50);
    } else {
      roomRef.child('mapState').on('value', (snap) => {
        const data = snap.val();
        if(data){
          movingPlatform.x = data.platX;
          enemies[0].x = data.e1X; enemies[0].alive = data.e1Alive;
          enemies[1].x = data.e2X; enemies[1].alive = data.e2Alive;
        }
      });
    }

    // Polling kirim posisi player lokal (Setiap 30ms)
    setInterval(() => {
      if(roomRef && myChar){
        roomRef.child(myRole).set({
          x: Math.round(myChar.x),
          y: Math.round(myChar.y),
          facing: myChar.facing
        });
      }
    }, 30);

    loop();
  }

  function respawn(){
    myChar.x = myChar.spawnX;
    myChar.y = myChar.spawnY;
    myChar.vx = 0;
    myChar.vy = 0;
  }

  function update(){
    if(!myChar) return;

    if(window.keys.left) { myChar.vx = -2.8; myChar.facing = 'left'; }
    else if(window.keys.right) { myChar.vx = 2.8; myChar.facing = 'right'; }
    else { myChar.vx *= 0.8; }

    myChar.vy += gravity;
    myChar.x += myChar.vx;
    myChar.y += myChar.vy;

    // Smooth Lerp untuk posisi lawan
    opponentChar.x += (opponentChar.targetX - opponentChar.x) * 0.4;
    opponentChar.y += (opponentChar.targetY - opponentChar.y) * 0.4;

    // Gerak platform berjalan (Hanya Host yang menghitung fisik)
    if(myRole === 'p1'){
      movingPlatform.x += movingPlatform.vx;
      if(movingPlatform.x <= movingPlatform.minX || movingPlatform.x >= movingPlatform.maxX) movingPlatform.vx *= -1;
    }

    myChar.grounded = false;
    const allPlatforms = [...platforms, movingPlatform];

    allPlatforms.forEach(p => {
      if(myChar.x < p.x + p.w && myChar.x + myChar.w > p.x &&
         myChar.y + myChar.h >= p.y && myChar.y + myChar.h <= p.y + p.h + myChar.vy + 2){
          myChar.y = p.y - myChar.h;
          myChar.vy = 0;
          myChar.grounded = true;
          if(p === movingPlatform && myRole === 'p1') myChar.x += movingPlatform.vx;
      }
    });

    if(myChar.y > canvas.height + 40) respawn();

    coinsList.forEach((c, i) => {
      if(c.taken) return;
      if(myChar.x < c.x + 12 && myChar.x + myChar.w > c.x && myChar.y < c.y + 12 && myChar.y + myChar.h > c.y){
        c.taken = true;
        roomRef.child('coins/' + i).set(true);
      }
    });

    enemies.forEach(e => {
      if(!e.alive) return;
      if(myRole === 'p1'){
        e.x += e.vx;
        if(e.x <= e.minX || e.x >= e.maxX) e.vx *= -1;
      }

      if(myChar.x < e.x + e.w && myChar.x + myChar.w > e.x && myChar.y < e.y + e.h && myChar.y + myChar.h > e.y){
        if(myChar.vy > 0 && myChar.y + myChar.h - myChar.vy <= e.y + 6){
          e.alive = false;
          myChar.vy = -6;
        } else {
          respawn();
        }
      }
    });

    if(!gameOver && myChar.x >= 750){
      roomRef.child('winner').transaction((current) => current || myRole);
    }
  }

  function drawPlayer(p, mainColor, hatColor){
    ctx.fillStyle = mainColor;
    ctx.fillRect(p.x, p.y + 6, p.w, p.h - 6);
    ctx.fillStyle = '#ffcc99';
    ctx.fillRect(p.x + (p.facing === 'right' ? 4 : 0), p.y + 4, 12, 8);
    ctx.fillStyle = hatColor;
    ctx.fillRect(p.x + (p.facing === 'right' ? 2 : -2), p.y, 16, 5);
    ctx.fillStyle = '#000';
    ctx.fillRect(p.x + (p.facing === 'right' ? 12 : 3), p.y + 6, 2, 2);
  }

  function draw(){
    if(!myChar) return;
    ctx.clearRect(0,0,canvas.width,canvas.height);

    let cameraX = myChar.x - 100;
    if(cameraX < 0) cameraX = 0;

    ctx.save();
    ctx.translate(-cameraX, 0);

    ctx.fillStyle = '#5c94fc';
    ctx.fillRect(cameraX, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(150, 50, 16, 0, Math.PI * 2);
    ctx.arc(170, 45, 20, 0, Math.PI * 2);
    ctx.arc(190, 50, 16, 0, Math.PI * 2);
    ctx.fill();

    platforms.forEach(p => {
      ctx.fillStyle = '#c84c0c';
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = '#00a800';
      ctx.fillRect(p.x, p.y, p.w, 4);
    });

    ctx.fillStyle = '#fc9838';
    ctx.fillRect(movingPlatform.x, movingPlatform.y, movingPlatform.w, movingPlatform.h);

    coinsList.forEach(c => {
      if(c.taken) return;
      ctx.fillStyle = '#ffd33d';
      ctx.beginPath();
      ctx.arc(c.x + 6, c.y + 6, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#e3a800';
      ctx.beginPath();
      ctx.arc(c.x + 6, c.y + 6, 6, 0, Math.PI * 2);
      ctx.stroke();
    });

    enemies.forEach(e => {
      if(e.alive){
        ctx.fillStyle = '#a81000';
        ctx.fillRect(e.x, e.y, e.w, e.h);
        ctx.fillStyle = '#fff';
        ctx.fillRect(e.x + 2, e.y + 4, 3, 4);
        ctx.fillRect(e.x + 11, e.y + 4, 3, 4);
      }
    });

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(760, 90, 4, 120);
    ctx.fillStyle = '#2ecc71';
    ctx.beginPath();
    ctx.moveTo(764, 90); ctx.lineTo(790, 105); ctx.lineTo(764, 120);
    ctx.fill();

    const p1Color = '#e74c3c', p2Color = '#2ecc71';
    if(myRole === 'p1'){
      drawPlayer(opponentChar, p2Color, p2Color);
      drawPlayer(myChar, p1Color, p1Color);
    } else {
      drawPlayer(opponentChar, p1Color, p1Color);
      drawPlayer(myChar, p2Color, p2Color);
    }

    ctx.restore();
  }

  function loop(){
    update(); draw();
    requestAnimationFrame(loop);
  }

  const bL = document.getElementById('btnLeft');
  const bR = document.getElementById('btnRight');
  const bJ = document.getElementById('btnJump');

  const setLeft = (val) => window.keys ? window.keys.left = val : null;
  const setRight = (val) => window.keys ? window.keys.right = val : null;

  bL.addEventListener('touchstart', (e)=>{ e.preventDefault(); setLeft(true); });
  bL.addEventListener('touchend', (e)=>{ e.preventDefault(); setLeft(false); });
  bR.addEventListener('touchstart', (e)=>{ e.preventDefault(); setRight(true); });
  bR.addEventListener('touchend', (e)=>{ e.preventDefault(); setRight(false); });

  bL.addEventListener('mousedown', ()=> setLeft(true));
  bL.addEventListener('mouseup', ()=> setLeft(false));
  bL.addEventListener('mouseleave', ()=> setLeft(false));
  bR.addEventListener('mousedown', ()=> setRight(true));
  bR.addEventListener('mouseup', ()=> setRight(false));
  bR.addEventListener('mouseleave', ()=> setRight(false));

  function doJump(){
    if(myChar && myChar.grounded){ myChar.vy = -9.2; myChar.grounded = false; }
  }

  bJ.addEventListener('touchstart', (e)=>{ e.preventDefault(); doJump(); });
  bJ.addEventListener('mousedown', doJump);

  // Kontrol keyboard buat testing di desktop (Panah / WASD / Spasi)
  document.addEventListener('keydown', (e)=>{
    if(!window.keys) return;
    if(e.code === 'ArrowLeft' || e.code === 'KeyA') setLeft(true);
    if(e.code === 'ArrowRight' || e.code === 'KeyD') setRight(true);
    if(e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space'){ e.preventDefault(); doJump(); }
  });
  document.addEventListener('keyup', (e)=>{
    if(!window.keys) return;
    if(e.code === 'ArrowLeft' || e.code === 'KeyA') setLeft(false);
    if(e.code === 'ArrowRight' || e.code === 'KeyD') setRight(false);
  });

  document.getElementById('btnRestart').onclick = () => {
    location.reload();
  };

})();
</script>
</body>
</html>
